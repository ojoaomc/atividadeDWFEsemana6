<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuiaBH</title>
    <link rel="stylesheet" href="./assets/css/estilo.css">
</head>

<body>
    <header>
        <h1 class="titulo">GuiaBH - O guia para quem quer diversificar</h1>
        <!-- FORMULÁRIO DE PESQUISA NO HEADER -->
        <form class="form-pesquisa-header">
            <div class="campo-busca">
                <label for="busca-site" class="sr-only">Pesquisar no site:</label>
                <input type="text" id="busca-site" name="busca" placeholder="Pesquisar">
            </div>
        </form>
    </header>
    <section>
        <nav>
            <ul class="menu-lateral">
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="rotulo">Itens salvos</div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="rotulo">Favoritos</div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="rotulo">Sair</div>
                        </div>
                    </a>
                </li>
            </ul>
        </nav>

        <form class="form-pesquisa-filtro">
            <div class="campo-filtro">
                <label for="filtro-tipo" class="sr-only">Filtrar por:</label>
                <input type="text" id="filtro-tipo" name="filtro" placeholder="Ex: Cachoeira, Museu...">
            </div>

            <button type="submit" class="botao-pesquisa">Buscar</button>
        </form>

        <main id="cartoes" class="container">
            <div class="cartao">
                <img class="imagem-do-cartao" src="./assets/img/trilha.png">
                <section class="corpo-do-cartao">
                    <p class="nome-da-opcao">
                        Trilhas em BH
                    </p>
                    <p class="descricao-da-opcao">Veja opções de trilhas em Belo Horizonte.</p>
                </section>
            </div>
            <div class="cartao">
                <img class="imagem-do-cartao" src="./assets/img/igrejaPampulha.png">
                <section class="corpo-do-cartao">
                    <p class="nome-da-opcao">
                        Arquitetura
                    </p>
                    <p class="descricao-da-opcao">Conheça a arquitetura de Belo Horizonte.</p>
                </section>
            </div>
            <div class="cartao">
                <img class="imagem-do-cartao" src="./assets/img/ccbb.png">
                <section class="corpo-do-cartao">
                    <p class="nome-da-opcao">
                        Cultura
                    </p>
                    <p class="descricao-da-opcao">Veja as opções de acesso à cultura em Belo Horizonte.</p>
                </section>
            </div>
        </main>
    </section>
    <footer>&copy, GuiaBH, 2026</footer>
</body>
</html>
